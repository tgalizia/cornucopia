<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Rename tab</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body class="grant">
    <main>
      <h1>Rename tab</h1>
      <p id="copy">Allow site access so this tab can keep the name <strong id="title">you chose</strong>.</p>
      <p class="muted">The name stays on this device and is put back when the tab loads, including after a restart. Nothing is sent off this browser.</p>
      <p id="notice" class="notice" hidden></p>
      <button id="allow" class="ghost" type="button">Allow</button>
    </main>
    <script src="rename-grant.js"></script>
  </body>
</html>
