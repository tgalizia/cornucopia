<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Clear site data</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body class="grant">
    <main>
      <h1>Clear site data</h1>
      <p id="copy">Allow Cornucopia to delete cookies and storage for <strong id="host">this site</strong>.</p>
      <p class="muted">Cookies are removed for the site's domain. Cache Storage is removed for this origin only. The tab then reloads. Nothing is sent off this browser.</p>
      <p id="notice" class="notice" hidden></p>
      <button id="allow" class="danger" type="button">Allow and clear</button>
    </main>
    <script src="grant.js"></script>
  </body>
</html>
